[project]
name = "Nanashi-OpenShock-MCP"
version = "0.0.1.3"
description = "Loopback-only MCP server for OpenShock"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]

authors = [
    { name = "NanashiTheNameless" },
    { name = "NanashiTheNameless", email = "NanashiTheNameless@NamelessNanashi.dev" }
]

maintainers = [
    { name = "NanashiTheNameless" },
    { name = "NanashiTheNameless", email = "NanashiTheNameless@NamelessNanashi.dev" }
]

dependencies = [
    "mcp>=1.27.0",
    "Nanashi-OpenShockPY>=0.0.2.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.8.5",
]


[project.scripts]
nanashi-openshock-mcp = "openshock_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/NanashiTheNameless/OpenShockMCP"
Issues = "https://github.com/NanashiTheNameless/OpenShockMCP/issues"
"GitHub Sponsor" = "https://github.com/sponsors/NanashiTheNameless"
"Buy Me a Coffee" = "https://buymeacoffee.com/NamelessNanashi"

[tool.setuptools.package-data]
openshock_mcp = ["py.typed"]
